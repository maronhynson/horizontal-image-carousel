<div class="col-lg-8 col-md-8 order-1 order-lg-1 content">
    <div style="border-right: 3px solid #404040; height: 100%; padding-right: 15px">
        
        <h1 style="font-size: 32px; text-align: center;">COLLEGE OF BUSINESS ENTREPRENEURSHIP AND ACCOUNTANCY</h1>
        <hr>
        
        <!-- Horizontal Carousel Container -->
        <div class="carousel-wrapper" style="position: relative; overflow: hidden; margin: 20px 0;">
            
            <!-- Carousel Track -->
            <div class="carousel-track" style="
                display: flex;
                transition: transform 0.3s ease-in-out;
                gap: 10px;
                padding: 10px 0;
            ">
                <img src="cbea/cbea_image/cbea_faculty2026_1.jpg" class="carousel-item" alt="Faculty 1">
                <img src="cbea/cbea_image/cbea_faculty2026_2.jpg" class="carousel-item" alt="Faculty 2">
                <img src="cbea/cbea_image/cbea_faculty2026_3.jpg" class="carousel-item" alt="Faculty 3">
                <img src="cbea/cbea_image/cbea_faculty2026_4.jpg" class="carousel-item" alt="Faculty 4">
                <img src="cbea/cbea_image/cbea_faculty2026_5.jpg" class="carousel-item" alt="Faculty 5">
                <img src="cbea/cbea_image/cbea_faculty2026_6.jpg" class="carousel-item" alt="Faculty 6">
                <img src="cbea/cbea_image/cbea_faculty2026_7.jpg" class="carousel-item" alt="Faculty 7">
                <img src="cbea/cbea_image/cbea_faculty2026_8.jpg" class="carousel-item" alt="Faculty 8">
                <img src="cbea/cbea_image/cbea_faculty2026_9.jpg" class="carousel-item" alt="Faculty 9">
            </div>
            
            <!-- Previous Button -->
            <button class="carousel-button carousel-prev" style="
                position: absolute;
                left: 0;
                top: 50%;
                transform: translateY(-50%);
                z-index: 10;
                background: rgba(0, 0, 0, 0.5);
                color: white;
                border: none;
                padding: 12px 15px;
                cursor: pointer;
                font-size: 18px;
                border-radius: 0 4px 4px 0;
                transition: background 0.3s;
            " onclick="moveCarousel(-1)">
                ❮
            </button>
            
            <!-- Next Button -->
            <button class="carousel-button carousel-next" style="
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                z-index: 10;
                background: rgba(0, 0, 0, 0.5);
                color: white;
                border: none;
                padding: 12px 15px;
                cursor: pointer;
                font-size: 18px;
                border-radius: 4px 0 0 4px;
                transition: background 0.3s;
            " onclick="moveCarousel(1)">
                ❯
            </button>
        </div>
        
        <br>
    </div>
</div>
